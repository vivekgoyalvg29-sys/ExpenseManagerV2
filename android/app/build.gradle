plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// Google Play uploads must be signed with your upload key (not debug). See android/key.properties.example.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseStoreFile = (keystorePropertiesFile.exists() && keystoreProperties['storeFile'])
    ? rootProject.file(keystoreProperties['storeFile'])
    : file('fintrack.jks')
def releaseKeyAlias = keystoreProperties['keyAlias'] ?: 'fintrack'
def releaseStorePassword = keystoreProperties['storePassword'] ?: System.getenv('KEY_STORE_PASSWORD')
def releaseKeyPassword = keystoreProperties['keyPassword'] ?: System.getenv('KEY_PASSWORD')
// Only use release keystore when file exists and passwords are set (else debug — OK for local test APKs).
def hasReleaseSigning = releaseStoreFile.exists() &&
    releaseStorePassword != null && !releaseStorePassword.toString().trim().isEmpty() &&
    releaseKeyPassword != null && !releaseKeyPassword.toString().trim().isEmpty()

android {
    namespace 'vivek.fintrack.app'
    // Match Flutter defaults (API 36+ for current AndroidX).
    compileSdk 36
    ndkVersion '28.2.13676358'

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId 'vivek.fintrack.app'
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-auth'
}

// Apply Google Services plugin at the bottom
apply plugin: 'com.google.gms.google-services'
