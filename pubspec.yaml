name: expense_manager
description: Personal Expense Manager
publish_to: "none"
version: 1.0.21+51

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3
  synchronized: ^3.3.0
  path: ^1.9.0
  intl: 0.20.2
  home_widget: ^0.7.0
  flutter_native_splash: ^2.3.9
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  excel: ^4.0.6
  file_picker: ^8.0.5
  path_provider: ^2.1.4
  package_info_plus: ^8.0.2
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  mobile_scanner: ^5.1.1
  android_intent_plus: ^5.3.0
  url_launcher: ^6.2.5
  cloud_firestore: ^6.2.0
  in_app_update: ^4.2.5
  firebase_remote_config: ^6.3.0
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.4.0+10
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/splash_icon.png
    - assets/onboarding/
    - assets/adi-registration.properties
    # Each category folder must be listed; `assets/seed_icons/` alone does not bundle
    # nested folders on Windows/Flutter 3.41 (see flutter_assets after build).
    - assets/seed_icons/bonus/
    - assets/seed_icons/cash/
    - assets/seed_icons/credit_card/
    - assets/seed_icons/dining/
    - assets/seed_icons/donations/
    - assets/seed_icons/education/
    - assets/seed_icons/emis/
    - assets/seed_icons/entertainment/
    - assets/seed_icons/groceries/
    - assets/seed_icons/health/
    - assets/seed_icons/housing/
    - assets/seed_icons/insurance/
    - assets/seed_icons/interest/
    - assets/seed_icons/rental/
    - assets/seed_icons/salary/
    - assets/seed_icons/savings/
    - assets/seed_icons/shopping/
    - assets/seed_icons/subscriptions/
    - assets/seed_icons/transport/
    - assets/seed_icons/upi/
    - assets/seed_icons/utilities/
